<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Login</title><link rel="stylesheet" href="/web/theme.css"></head>
<body><main><h1>Business login</h1>
<form id="f"><label for="email">Email</label><input id="email" name="email" type="email">
<label for="pw">Password</label><input id="pw" name="password" type="password"><button type="submit">Log in</button></form>
<p id="err"></p>
<script>
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  fetch("/api/v1/auth/login", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ identifier: document.getElementById("email").value, password: document.getElementById("pw").value, device: "merchant" }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.success) { localStorage.setItem("qa_token", j.data.accessToken); location.href = "/web/index.html"; } else document.getElementById("err").textContent = j.message; });
});
</script></main></body></html>
